<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blacklist Monitor Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
    }

    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.3rem; color: #58a6ff; }
    header span { font-size: 0.85rem; color: #8b949e; }

    .container { max-width: 1100px; margin: 32px auto; padding: 0 24px; }

    /* Status bar */
    #status-bar {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    #job-status { font-weight: 600; }
    #job-status.running { color: #f0a500; }
    #job-status.idle    { color: #3fb950; }
    .btn {
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 18px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #2ea043; }
    .btn.secondary { background: #21262d; border: 1px solid #30363d; }
    .btn.secondary:hover { background: #30363d; }

    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }
    .stat-card .label { font-size: 0.78rem; color: #8b949e; margin-bottom: 8px; }
    .stat-card .value { font-size: 2rem; font-weight: 700; }
    .stat-card.clean       .value { color: #3fb950; }
    .stat-card.suspicious  .value { color: #f0a500; }
    .stat-card.blacklisted .value { color: #f85149; }
    .stat-card.total       .value { color: #58a6ff; }

    /* Results table */
    .section-title {
      font-size: 1rem;
      font-weight: 600;
      color: #e6edf3;
      margin-bottom: 12px;
    }
    .table-wrap {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 28px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    thead tr { background: #21262d; }
    th {
      padding: 10px 14px;
      text-align: left;
      color: #8b949e;
      font-weight: 600;
      border-bottom: 1px solid #30363d;
    }
    td {
      padding: 10px 14px;
      border-bottom: 1px solid #21262d;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1c2128; }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-SAFE        { background: #1a4731; color: #3fb950; }
    .badge-SUSPICIOUS  { background: #3d2b00; color: #f0a500; }
    .badge-BLACKLISTED { background: #3d0c0c; color: #f85149; }
    .badge-ERROR       { background: #2a2a2a; color: #8b949e; }

    #empty-msg { color: #8b949e; padding: 24px; text-align: center; }
    #error-msg { color: #f85149; padding: 16px; display: none; }

    footer {
      text-align: center;
      padding: 20px;
      color: #484f58;
      font-size: 0.78rem;
      border-top: 1px solid #21262d;
      margin-top: 32px;
    }
  </style>
</head>
<body>

<header>
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
  </svg>
  <h1>Blacklist Monitor</h1>
  <span id="last-updated"></span>
</header>

<div class="container">

  <!-- Status bar -->
  <div id="status-bar">
    <div>
      Job status: <span id="job-status" class="idle">idle</span>
    </div>
    <button class="btn" id="btn-run">▶ Run Now</button>
    <a href="/api/report" class="btn secondary" id="btn-download">⬇ Download Latest Report</a>
    <button class="btn secondary" id="btn-refresh">↺ Refresh</button>
  </div>

  <!-- Summary stats -->
  <div class="stats-grid">
    <div class="stat-card total">
      <div class="label">Total Checked</div>
      <div class="value" id="stat-total">–</div>
    </div>
    <div class="stat-card clean">
      <div class="label">Safe</div>
      <div class="value" id="stat-clean">–</div>
    </div>
    <div class="stat-card suspicious">
      <div class="label">Suspicious</div>
      <div class="value" id="stat-suspicious">–</div>
    </div>
    <div class="stat-card blacklisted">
      <div class="label">Blacklisted</div>
      <div class="value" id="stat-blacklisted">–</div>
    </div>
  </div>

  <!-- Results table -->
  <div class="section-title">Latest Scan Results</div>
  <div id="error-msg"></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Target</th>
          <th>Type</th>
          <th>Label</th>
          <th>Verdict</th>
          <th>Score</th>
          <th>Sources</th>
          <th>Checked At</th>
        </tr>
      </thead>
      <tbody id="results-body">
        <tr><td colspan="7" id="empty-msg">Loading…</td></tr>
      </tbody>
    </table>
  </div>

</div>

<footer>Domain Blacklist Monitor &bull; Auto-refreshes every 60 seconds</footer>

<script>
  const $ = id => document.getElementById(id);

  function formatDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString();
  }

  function badgeHtml(verdict) {
    const cls = 'badge badge-' + (verdict || 'ERROR').toUpperCase();
    return `<span class="${cls}">${verdict || 'ERROR'}</span>`;
  }

  async function loadResults() {
    try {
      const res = await fetch('/api/results');
      const data = await res.json();
      const rows = data.results || [];

      // Compute summary
      let clean = 0, suspicious = 0, blacklisted = 0;
      for (const r of rows) {
        const v = (r.verdict || '').toUpperCase();
        if (v === 'SAFE') clean++;
        else if (v === 'SUSPICIOUS') suspicious++;
        else if (v === 'BLACKLISTED') blacklisted++;
      }
      $('stat-total').textContent = rows.length;
      $('stat-clean').textContent = clean;
      $('stat-suspicious').textContent = suspicious;
      $('stat-blacklisted').textContent = blacklisted;

      // Fill table
      const tbody = $('results-body');
      if (rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" id="empty-msg">No results yet. Click "Run Now" to trigger a scan.</td></tr>';
        return;
      }

      const checkedAt = rows[0]?.results?.[0]?.checked_at;
      $('last-updated').textContent = checkedAt ? 'Last scan: ' + formatDate(checkedAt) : '';

      tbody.innerHTML = rows.map(r => `
        <tr>
          <td>${r.target}</td>
          <td>${r.type}</td>
          <td>${r.label || ''}</td>
          <td>${badgeHtml(r.verdict)}</td>
          <td>${r.overall_score ?? '—'}</td>
          <td>${r.source_count ?? '—'}</td>
          <td>${formatDate(r.results?.[0]?.checked_at)}</td>
        </tr>
      `).join('');
    } catch (err) {
      $('error-msg').style.display = 'block';
      $('error-msg').textContent = 'Failed to load results: ' + err.message;
    }
  }

  async function checkJobStatus() {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();
      const el = $('job-status');
      el.textContent = data.status;
      el.className = data.status === 'running' ? 'running' : 'idle';
    } catch {}
  }

  async function triggerRun() {
    $('btn-run').disabled = true;
    $('btn-run').textContent = 'Running…';
    try {
      const res = await fetch('/api/run', { method: 'POST' });
      const data = await res.json();
      if (res.ok) {
        alert('Scan complete!\n' + JSON.stringify(data.summary, null, 2));
        loadResults();
      } else {
        alert('Error: ' + (data.error || 'Unknown error'));
      }
    } catch (err) {
      alert('Request failed: ' + err.message);
    } finally {
      $('btn-run').disabled = false;
      $('btn-run').textContent = '▶ Run Now';
    }
  }

  $('btn-run').addEventListener('click', triggerRun);
  $('btn-refresh').addEventListener('click', () => { loadResults(); checkJobStatus(); });

  // Initial load
  loadResults();
  checkJobStatus();

  // Auto-refresh every 60 seconds
  setInterval(() => { loadResults(); checkJobStatus(); }, 60000);
</script>

</body>
</html>
